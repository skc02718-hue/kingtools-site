<svg xmlns="http://www.w3.org/2000/svg" width="1886" height="1000" viewBox="0 0 1886 1000" role="img" aria-labelledby="title desc">
  <title id="title">라이선스 프리웨어</title>
  <desc id="desc">사용자가 승인한 KINGTOOLS LICENSE 2번 슬라이드 디자인</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a42"/>
      <stop offset="0.62" stop-color="#0a2c69"/>
      <stop offset="1" stop-color="#0d3f82"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="84%" cy="16%" r="52%">
      <stop offset="0" stop-color="#2f7edf" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2f7edf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6d6ff" stop-opacity=".98"/>
      <stop offset="0.55" stop-color="#7aa9e4" stop-opacity=".88"/>
      <stop offset="1" stop-color="#456eaa" stop-opacity=".72"/>
    </linearGradient>
    <filter id="cardShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="23" flood-color="#031633" flood-opacity=".24"/>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#031633" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1886" height="1000" fill="url(#bg)"/>
  <rect width="1886" height="1000" fill="url(#softGlow)"/>

  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <!-- 왼쪽 문구 -->
    <text x="126" y="205" fill="#a9cffb" font-size="25" font-weight="800" letter-spacing="3.6">KINGTOOLS LICENSE</text>

    <text x="126" y="385" fill="#ffffff" font-size="108" font-weight="820" letter-spacing="0">라이선스</text>
    <text x="126" y="535" fill="#ffffff" font-size="108" font-weight="820" letter-spacing="0">프리웨어</text>

    <text x="126" y="651" fill="#d8e2f0" font-size="30" font-weight="500" letter-spacing="-.8">개인 · 기업 · 학교 · 기관 누구나 무료입니다.</text>
    <text x="126" y="703" fill="#d8e2f0" font-size="30" font-weight="500" letter-spacing="-.8">어떠한 라이선스 비용도 요구하지 않습니다.</text>

    <!-- 아래 3개 버튼 -->
    <g fill="#ffffff" fill-opacity=".035" stroke="#6f8fbf" stroke-width="2">
      <rect x="126" y="775" width="172" height="68" rx="34"/>
      <rect x="324" y="775" width="164" height="68" rx="34"/>
      <rect x="514" y="775" width="236" height="68" rx="34"/>
    </g>
    <g fill="#ffffff" font-size="24" font-weight="800">
      <text x="212" y="819" text-anchor="middle">개인 무료</text>
      <text x="406" y="819" text-anchor="middle">기업 무료</text>
      <text x="632" y="819" text-anchor="middle">학교·기관 무료</text>
    </g>

    <!-- 오른쪽 큰 원 -->
    <circle cx="1396" cy="470" r="286" fill="url(#orb)"/>

    <!-- FREE 칩 -->
    <g filter="url(#chipShadow)">
      <rect x="1040" y="300" width="190" height="78" rx="39" fill="#ffffff" fill-opacity=".97"/>
    </g>
    <text x="1135" y="350" fill="#0b4b9f" font-size="25" font-weight="900" text-anchor="middle">FREE</text>

    <!-- 가운데 흰 카드 -->
    <g transform="translate(1240 300) rotate(4 146 137)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="292" height="274" rx="54" fill="#ffffff"/>

      <!-- 승인된 문서 + 리본 체크 아이콘 -->
      <g transform="translate(82 61)" fill="none" stroke="#0e53ae" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4h70l25 25v82H8z" stroke-width="7"/>
        <path d="M78 4v29h29" stroke-width="7"/>
        <path d="M30 39h39M30 57h39M30 75h29" stroke-width="7"/>
        <circle cx="90" cy="92" r="27" fill="#ffffff" stroke-width="7"/>
        <path d="m77 92 10 10 19-22" stroke-width="7"/>
        <path d="m77 113-7 22 20-10 20 10-7-22" stroke-width="7"/>
      </g>
    </g>

    <!-- 0원 칩 -->
    <g filter="url(#chipShadow)">
      <rect x="1490" y="618" width="184" height="74" rx="37" fill="#ffffff" fill-opacity=".97"/>
    </g>
    <text x="1582" y="666" fill="#0b4b9f" font-size="26" font-weight="900" text-anchor="middle">0₩</text>

    <!-- 오른쪽 하단 문구 -->
    <text x="1395" y="790" fill="#ffffff" font-size="46" font-weight="900" text-anchor="middle">FREEWARE</text>
    <text x="1395" y="838" fill="#d7e2f2" font-size="25" font-weight="500" text-anchor="middle">누구나 자유롭게</text>
  </g>
</svg>