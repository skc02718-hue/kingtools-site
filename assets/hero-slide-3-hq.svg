    <text x="128" y="350" fill="#fff" font-size="112" font-weight="900">100%</text>
    <text x="128" y="486" fill="#fff" font-size="104" font-weight="850" letter-spacing="-2">클린 설치</text>

    <text x="128" y="585" fill="#ddfff4" font-size="31" font-weight="500">킹툴즈 모든 프로그램은 타사 제휴 소프트웨어를</text>
    <text x="128" y="636" fill="#ddfff4" font-size="31" font-weight="500">끼워 설치하지 않습니다.</text>

    <g filter="url(#soft)">
      <rect x="128" y="698" width="236" height="76" rx="38" fill="#fff"/>
      <rect x="382" y="698" width="182" height="76" rx="38" fill="#fff"/>
      <rect x="582" y="698" width="270" height="76" rx="38" fill="#fff"/>
    </g>
    <g fill="#078a66" font-size="24" font-weight="850">
      <text x="246" y="746" text-anchor="middle">✓ 제휴 설치 없음</text>
      <text x="473" y="746" text-anchor="middle">✓ 광고 없음</text>
      <text x="717" y="746" text-anchor="middle">✓ 개인정보 수집 없음</text>
    </g>

    <circle cx="1211" cy="407" r="246" fill="url(#orb)" filter="url(#shadow)"/>

    <g filter="url(#soft)"><rect x="889" y="283" width="207" height="76" rx="38" fill="#fff"/></g>
    <text x="992" y="332" fill="#078a66" font-size="25" font-weight="900" text-anchor="middle">NO BUNDLE</text>

    <g transform="translate(1076 280) rotate(-4 150 135)" filter="url(#shadow)">
      <rect width="300" height="270" rx="54" fill="#fff"/>
      <g transform="translate(78 59)" stroke="#07956d" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M72 0 18 19v42c0 35 22 65 54 77 32-12 54-42 54-77V19L72 0Z" stroke-width="9"/>
        <path d="m47 69 18 18 34-42" stroke-width="10"/>
      </g>
    </g>

    <g filter="url(#soft)"><rect x="1354" y="572" width="175" height="76" rx="38" fill="#fff"/></g>
    <text x="1441" y="621" fill="#078a66" font-size="25" font-weight="900" text-anchor="middle">NO ADS</text>

    <text x="1240" y="741" fill="#fff" font-size="43" font-weight="900" text-anchor="middle">100% CLEAN</text>
    <text x="1240" y="785" fill="#d9f5ea" font-size="25" text-anchor="middle">안심하고 설치</text>
