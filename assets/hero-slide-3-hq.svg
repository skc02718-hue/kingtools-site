<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">100% 클린 설치</title>
  <desc id="desc">KINGTOOLS PROMISE 클린 설치 배너</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#078d70"/>
      <stop offset="0.52" stop-color="#08b784"/>
      <stop offset="1" stop-color="#087455"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="14%" r="46%"><stop offset="0" stop-color="#75f0c7" stop-opacity=".55"/><stop offset="1" stop-color="#75f0c7" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9fff0" stop-opacity=".96"/><stop offset="1" stop-color="#72c5a9" stop-opacity=".55"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#034b38" flood-opacity=".24"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#034b38" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1672" height="941" rx="54" fill="url(#bg)"/>
  <rect width="1672" height="941" rx="54" fill="url(#glow)"/>
  <path d="M1270 941c16-195 122-326 402-382v382Z" fill="#087b5e" opacity=".24"/>
  <path d="M1374 941c12-132 93-223 298-270v270Z" fill="#066c51" opacity=".22"/>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
